[package]
name = "turnstile"
# Not the app version - the shipped version comes from package.json via
# tauri.conf.json. This crate isn't published and its version isn't read
# anywhere, so it's pinned to 0.0.0 to keep it out of the running as a
# version source. Cargo still requires some value here.
publish = false
version = "0.0.0"
description = "Turnstile - a Lean proof assistant pairing formal proofs with prose"
authors = ["W.P. McNeill <billmcn@gmail.com>"]
edition = "2021"

[lib]
name = "turnstile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
dirs = "6.0"
log = "0.4"
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_info"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"
tauri-plugin-single-instance = "2.4.1"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"
lsp-types = "0.95"
ts-rs = { version = "10", features = ["serde-compat"] }
katex = "0.4.6"
async-lsp = "0.2.3"
tower = "0.5"
tokio-util = { version = "0.7", features = ["compat"] }
tempfile = "3"
# GUI launches (Finder/Dock) don't inherit the login shell's PATH, so spawned
# elan/lake/lean tooling can't be found. fix-path-env reads the real PATH from
# the user's shell config at startup. Not published to crates.io, so pinned to a
# git revision.
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Lint policy lives here (not in CLI flags) so every clippy invocation -
# pre-commit hook, `pnpm verify`, CI, editors - agrees on the lint set.
# Levels are "warn" so dev builds aren't blocked; gates escalate with
# `cargo clippy -- -D warnings`.
[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
