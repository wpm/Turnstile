# Basic CI: runs on any push (and PRs targeting any branch).
#
# Two parallel jobs mirror the split in .githooks/pre-commit:
#   frontend  — prettier, eslint, svelte-check (type-check), plus tests
#   rust      — cargo fmt, clippy (-D warnings), plus cargo test
#
# The lint/format gates here are the non-mutating equivalents of the
# hook's --write/--fix commands; the hook escalates clippy warnings to
# errors and so does CI.
#
# Coverage note: instrumented coverage builds recompile the whole dependency
# tree and dominate the Rust job, so `cargo llvm-cov` + the Codecov upload run
# only on pushes to `main`. Other pushes run a plain `cargo test` for fast
# pass/fail feedback.
name: CI

on:
  push:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, format, check, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates .svelte-kit/ (route types, $app/$env ambient types) that the
      # type-aware eslint rules and svelte-check both need. Locally this dir
      # already exists; a fresh CI checkout has none, so sync it explicitly.
      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      # ── Formatting & linting (matches .githooks/pre-commit) ───────────────
      # The hook only formats staged .ts/.js/.svelte files, so scope prettier
      # to that set here rather than `prettier --check .` (the repo-wide
      # format:check script), which would also flag unrelated .md/.css assets
      # the hook never touches.
      - name: Format check (prettier)
        run: pnpm exec prettier --check "**/*.{ts,js,svelte}"

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Type-check (svelte-check)
        run: pnpm run check

      # ── Tests ─────────────────────────────────────────────────────────────
      # Run the unit suite under v8 coverage so we have an lcov report to ship
      # to Codecov (test:coverage == `vitest run --project unit --coverage`).
      - name: Unit tests (vitest)
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: wpm/Turnstile
          files: ./coverage/lcov.info
          flags: frontend

      # Release tooling: the artifact-normalization + SHA256SUMS script
      # (scripts/normalize-artifacts.sh) shells out, so its tests live outside
      # the v8-coverage unit project. Guards the release naming contract the
      # website's latest/download links depend on (#24).
      - name: Release script tests (vitest)
        run: pnpm run test:scripts

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: pnpm exec playwright test

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    env:
      # The Lean toolchain + Mathlib revision the app pins in src-tauri/src/setup.rs.
      # Keep these in sync with LEAN_TOOLCHAIN / MATHLIB_REV there.
      LEAN_TOOLCHAIN: leanprover/lean4:v4.29.0
      MATHLIB_REV: v4.29.0
      # Harden cargo's crates.io downloads against transient network flakes.
      # Runs have intermittently failed with curl "[16] Error in the HTTP2
      # framing layer" while fetching crates; disabling HTTP/2 multiplexing
      # falls back to sequential HTTP/1.1 transfers (no framing layer), and a
      # higher retry count rides out brief blips.
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5

      # Tauri v2 build/test dependencies on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget \
            curl

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy llvm-tools-preview

      # cargo-llvm-cov instruments `cargo test` to emit an lcov report for
      # Codecov; needs the llvm-tools-preview component added above. Only the
      # coverage run (main) uses it, so skip the install elsewhere.
      - name: Install cargo-llvm-cov
        if: github.ref == 'refs/heads/main'
        uses: taiki-e/install-action@cargo-llvm-cov

      # Swatinem/rust-cache (vs a hand-rolled actions/cache) saves a fresh
      # cache on every successful run and keys on the rustc version + lockfile,
      # so compiled dependencies actually persist run-to-run. The previous
      # actions/cache keyed only on Cargo.lock, which froze the cache after its
      # first save ("not saving cache") and left the coverage build recompiling
      # the whole dependency tree each time. rust-cache also trims the target
      # dir before saving, keeping the cache small enough to dodge GitHub's
      # 10 GB/repo eviction (which competes with the large Lean/Mathlib cache).
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Lean toolchain + Mathlib ──────────────────────────────────────────
      # The `lean::tests::*` integration tests spawn a real `lean --server`
      # against a Mathlib-enabled project (see src-tauri/src/lean/server.rs:
      # make_project_dir, which symlinks lean-toolchain / lakefile.toml /
      # lake-manifest.json / .lake/packages from setup::project_dir()).
      #
      # We reproduce exactly what src-tauri/src/setup.rs builds on first launch,
      # then point the tests at it with TURNSTILE_PROJECT_DIR. elan + the Mathlib
      # cache are slow to fetch once and then restored from cache, so only the
      # first run on a given toolchain/revision pays the cost.
      - name: Configure Lean project path
        run: echo "TURNSTILE_PROJECT_DIR=$HOME/turnstile-lean-project" >> "$GITHUB_ENV"

      - name: Cache Lean toolchain and Mathlib
        id: lean-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.elan
            ~/turnstile-lean-project
          key: ${{ runner.os }}-lean-${{ env.LEAN_TOOLCHAIN }}-mathlib-${{ env.MATHLIB_REV }}

      - name: Install elan and Lean toolchain
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh \
            | sh -s -- --no-modify-path -y --default-toolchain "$LEAN_TOOLCHAIN"

      - name: Provision Mathlib project
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p "$TURNSTILE_PROJECT_DIR"
          cd "$TURNSTILE_PROJECT_DIR"
          printf '%s' "$LEAN_TOOLCHAIN" > lean-toolchain
          cat > lakefile.toml <<EOF
          name = "turnstile-scratch"
          version = "0.1.0"

          [[require]]
          name = "mathlib"
          scope = "leanprover-community"
          rev = "$MATHLIB_REV"

          [[lean_lib]]
          name = "Proof"
          EOF
          printf 'import Mathlib\n' > Proof.lean
          # Fetch Mathlib (writes lake-manifest.json) then pull its prebuilt
          # cache so `import Mathlib` elaborates without a full local build.
          lake update
          lake exe cache get

      - name: Put elan on PATH
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # ── Formatting & linting (matches .githooks/pre-commit) ───────────────
      - name: Format check (cargo fmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # ── Tests ─────────────────────────────────────────────────────────────
      # TURNSTILE_PROJECT_DIR (set above) points the lean integration tests at
      # the provisioned Mathlib project.
      #
      # The instrumented coverage build (`cargo llvm-cov`) compiles into its own
      # target/llvm-cov-target/ dir and so cannot reuse the artifacts clippy and
      # a normal build warm — it recompiles the entire dependency tree, which is
      # ~95% of the step's wall time (the tests themselves run in ~17s). To keep
      # per-commit feedback fast we run a plain `cargo test` on branch pushes
      # (reusing the cached debug deps) and only pay the coverage cost on `main`,
      # which is the ref Codecov reports against.
      - name: Rust tests (cargo test)
        if: github.ref != 'refs/heads/main'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust tests (cargo test) with coverage
        if: github.ref == 'refs/heads/main'
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: wpm/Turnstile
          files: ./lcov.info
          flags: rust
