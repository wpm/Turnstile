# Basic CI: runs on any push (and PRs targeting any branch).
#
# Two parallel jobs mirror the split in .githooks/pre-commit:
#   frontend  — prettier, eslint, svelte-check (type-check), plus tests
#   rust      — cargo fmt, clippy (-D warnings), plus cargo test
#
# The lint/format gates here are the non-mutating equivalents of the
# hook's --write/--fix commands; the hook escalates clippy warnings to
# errors and so does CI.
name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, format, check, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Formatting & linting (matches .githooks/pre-commit) ───────────────
      - name: Format check (prettier)
        run: pnpm run format:check

      - name: Lint (eslint)
        run: pnpm run lint

      - name: Type-check (svelte-check)
        run: pnpm run check

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Unit tests (vitest)
        run: pnpm run test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (Playwright)
        run: pnpm exec playwright test

  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri v2 build/test dependencies on Linux.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget \
            curl

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ── Formatting & linting (matches .githooks/pre-commit) ───────────────
      - name: Format check (cargo fmt)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint (clippy)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Rust tests (cargo test)
        run: cargo test --manifest-path src-tauri/Cargo.toml
