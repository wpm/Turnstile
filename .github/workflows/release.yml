# Release: build the full installer matrix on a version tag and publish a
# DRAFT GitHub Release with every artifact attached (issue #20).
#
# Where the other workflows stop short of a shippable release, this one
# produces it:
#   - package-check.yml (#21)  compiles + validates config (--no-bundle), per PR
#   - linux-bundle.yml  (#37)  builds the real Linux installers on main + smoke
#   - release.yml       (#20)  builds macOS + Linux installers from a v* tag,
#                              signs/notarizes macOS, normalizes to stable names
#                              with SHA256SUMS (#24), and drafts the Release.
#
# Flow: a `v*` tag is pushed → the macOS and Linux legs build in parallel and
# each stages its bundle(s) under stable, version-less names (#24) → the
# `release` job collects all four artifacts, writes SHA256SUMS over the lot,
# and creates/updates a single DRAFT Release. A human verifies the draft on
# real hardware (#33/#34) before publishing. The full runbook is RELEASING.md.
#
# Signing/notarization: the macOS leg passes the six APPLE_* repo secrets (#30)
# through to `tauri build`, which imports the cert into a temp keychain, signs
# with the Developer ID identity, and notarizes + staples. When those secrets
# are absent (forks, or before #30 is configured) the macOS build still
# succeeds UNSIGNED, and the Linux leg never references them, so a missing
# Apple secret never hard-fails the run.
name: Release

# Tag pushes cut a release; workflow_dispatch allows re-running against an
# existing tag/ref from the Actions tab (e.g. a transient notarization failure)
# without re-tagging. Re-runs update the existing draft rather than duplicating
# it — see the `release` job.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# Never let two runs for the same tag race to write the same draft Release.
# Unlike CI we do NOT cancel in-progress runs: a release build is long and
# expensive (the macOS notarization wait alone can be 20+ minutes), so we let a
# running release finish rather than killing it on a re-dispatch.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Preflight ───────────────────────────────────────────────────────────
  # Cheap gate that runs before the expensive build legs so a mis-tagged
  # release fails in seconds rather than after a 30-minute macOS build:
  #   - confirms the tag's base version matches the source version in
  #     package.json (the single version source; see src-tauri/Cargo.toml's
  #     0.0.0 note). This mirrors the version-consistency check CI enforces on
  #     main (#25) — RELEASING.md promises the release workflow refuses to build
  #     when the tag disagrees with the source.
  #   - decides pre-release vs normal from the tag string and exports it for the
  #     `release` job (#20: -rc/-beta/-alpha → pre-release).
  meta:
    name: Preflight (version + prerelease)
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.compute.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute release metadata
        id: compute
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          echo "Tag/ref: $tag"

          # Strip the required leading 'v' (RELEASING.md: the 'v' is what the
          # push trigger keys on) to get the semver string.
          semver="${tag#v}"

          # A pre-release tag carries an -rc / -beta / -alpha suffix; mark those
          # as GitHub pre-releases so they never become `latest` (#20, #26).
          case "$semver" in
            *-rc*|*-beta*|*-alpha*) prerelease=true ;;
            *)                      prerelease=false ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Pre-release: $prerelease"

          # The base version is the semver with any pre-release suffix removed
          # (1.0.0-rc.1 -> 1.0.0). The three version files carry the BASE
          # version with no -rc suffix (RELEASING.md), so compare against that.
          base="${semver%%-*}"

          source_version="$(node -p "require('./package.json').version")"
          echo "Tag base version: $base"
          echo "Source version (package.json): $source_version"
          if [ "$base" != "$source_version" ]; then
            echo "::error::Tag base version '$base' does not match package.json version '$source_version'. Bump the version files before tagging (see RELEASING.md)."
            exit 1
          fi

  # ── macOS universal bundle ──────────────────────────────────────────────
  # Builds a single universal (Intel + Apple Silicon) .dmg on macos-14, signed
  # and notarized when the APPLE_* secrets are present. Stages it under the
  # stable name Turnstile-macOS-universal.dmg (#24) and uploads it for the
  # assembly job.
  macos:
    name: macOS universal (.dmg)
    needs: meta
    runs-on: macos-14
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates .svelte-kit/ (route types, ambient $app/$env types) that the
      # frontend build invoked by tauri's beforeBuildCommand needs on a fresh
      # checkout, matching the other workflows.
      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      # Both arch slices are required to fuse a universal binary. macos-14 ships
      # rustup with the host (aarch64) target; add x86_64 explicitly.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal-apple-darwin

      # Build the universal bundle. Tauri reads the APPLE_* env vars directly:
      # APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD import the Developer ID cert
      # into a temporary keychain, APPLE_SIGNING_IDENTITY selects it, and
      # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID drive notarization + stapling. When
      # the secrets are unset (forks / before #30), these expand to empty and
      # tauri produces an UNSIGNED bundle without failing — exactly what we want
      # so the matrix stays green without Apple credentials.
      - name: Tauri build (universal, signed + notarized when secrets present)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin

      # Copy the built .dmg to its stable, version-less name (#24). The script
      # leaves the versioned original in place and fails loudly on >1 match.
      - name: Stage stable-named artifact
        run: |
          scripts/normalize-artifacts.sh \
            --in src-tauri/target/universal-apple-darwin/release/bundle \
            --out dist

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-macos
          path: dist/
          if-no-files-found: error

  # ── Linux x86_64 bundles ────────────────────────────────────────────────
  # Builds .deb/.rpm/.AppImage on ubuntu-22.04 using the same WebKit/GTK system
  # deps as the rust CI job, stages them under stable names (#24), and uploads
  # them. References no Apple secrets, so it cannot be blocked by their absence.
  linux:
    name: Linux x86_64 (.deb/.rpm/.AppImage)
    needs: meta
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5

      # Tauri v2 build dependencies — same list as the rust job in ci.yml and
      # the bundle job in linux-bundle.yml.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            wget \
            curl

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-unknown-linux-gnu

      # Produce all three Linux formats (bundle.targets is "all" in
      # tauri.conf.json). Passing --target keeps the output path predictable for
      # the normalize step below.
      - name: Tauri build (bundle)
        run: pnpm tauri build --target x86_64-unknown-linux-gnu

      - name: Stage stable-named artifacts
        run: |
          scripts/normalize-artifacts.sh \
            --in src-tauri/target/x86_64-unknown-linux-gnu/release/bundle \
            --out dist

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-linux
          path: dist/
          if-no-files-found: error

  # ── Assemble + draft the Release ────────────────────────────────────────
  # Collects the stable-named artifacts from both legs into one directory,
  # writes SHA256SUMS over all four (#24), and creates/updates the DRAFT
  # Release. Re-running on the same tag updates this draft in place (stable
  # names overwrite, no duplicates), satisfying the idempotency criterion.
  release:
    name: Draft GitHub Release
    needs: [meta, macos, linux]
    runs-on: ubuntu-latest
    # The Release-creating step needs write access to repo contents (#31).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # Merge both legs' uploads into a single dist/ directory.
      - name: Download stable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stable-*
          path: dist
          merge-multiple: true

      # SHA256SUMS spans the full set, so it must be computed here — after both
      # legs' artifacts are present — not on either leg alone (#24).
      - name: Write SHA256SUMS
        run: scripts/normalize-artifacts.sh --out dist --checksums

      - name: List release assets
        run: ls -la dist

      # softprops/action-gh-release is idempotent per tag: it creates the
      # Release if absent, otherwise updates the existing one, and uploads the
      # files by name — so a re-run overwrites the same stable-named assets
      # rather than duplicating them. Kept a DRAFT so Bill reviews before it
      # goes public (#34); flagged pre-release for -rc/-beta/-alpha tags so it
      # never becomes `latest` (#20, #26).
      - name: Create or update draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/Turnstile-macOS-universal.dmg
            dist/Turnstile-linux-x86_64.deb
            dist/Turnstile-linux-x86_64.rpm
            dist/Turnstile-linux-x86_64.AppImage
            dist/SHA256SUMS
