# Release: build the full installer matrix when a GitHub Release is published
# and attach every artifact onto that Release (issue #54, superseding the
# tag-trigger + draft-creation design of #20).
#
# Where the other workflows stop short of a shippable release, this one
# produces it:
#   - package-check.yml (#21)  compiles + validates config (--no-bundle), per PR
#   - linux-bundle.yml  (#37)  builds the real Linux installers on main + smoke
#   - release.yml       (#54)  builds macOS + Linux installers when a Release is
#                              published, signs/notarizes macOS, normalizes to
#                              stable names with SHA256SUMS (#24), and uploads
#                              the lot onto the triggering Release.
#
# Flow: a maintainer creates a Release in the GitHub UI (sets the tag, writes
# notes, ticks pre-release for RCs, Publishes) → the `release: published` event
# fires → the macOS and Linux legs build in parallel and each stages its
# bundle(s) under stable, version-less names (#24) → the `attach` job collects
# all four artifacts, writes SHA256SUMS over the lot, and uploads them onto the
# published Release with `--clobber` (so re-runs replace assets rather than
# fail). CI never creates a Release — the human owns that in the UI. The full
# runbook is RELEASING.md.
#
# Known, accepted gap: the event fires only on publish and notarization takes a
# few minutes, so the live Release shows notes with no downloads until the
# attach job finishes. Re-run the run to recover from a transient failure — the
# Release already exists, so the attach job re-uploads via --clobber.
#
# Signing/notarization: the macOS leg passes the six APPLE_* repo secrets (#30)
# through to `tauri build`, which imports the cert into a temp keychain, signs
# with the Developer ID identity, and notarizes + staples. When those secrets
# are absent (forks, or before #30 is configured) the macOS build still
# succeeds UNSIGNED, and the Linux leg never references them, so a missing
# Apple secret never hard-fails the run.
name: Release

# Publishing a Release in the UI is the entry point. The event fires for both
# normal and pre-release publishes; CI no longer triggers on tag pushes and
# never creates a Release itself (#54).
on:
  release:
    types: [published]

# Never let two publishes for the same tag race to attach the same assets.
# Unlike CI we do NOT cancel in-progress runs: a release build is long and
# expensive (the macOS notarization wait alone can be 20+ minutes), so we let a
# running release finish rather than killing it on a re-publish.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # ── Tag ↔ package.json check ────────────────────────────────────────────
  # Cheap gate that runs before the expensive build legs so a mis-tagged
  # Release fails in seconds rather than after a 30-minute macOS build. The
  # build reads the version from package.json (the single source — #25); the
  # tag is only a label, and this guard keeps the two honest so a typo'd tag
  # can't ship mislabeled binaries.
  check:
    name: Check tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare release tag to source version
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"      # e.g. v1.0.0-rc.1
          base="${tag#v}"; base="${base%%-*}"             # -> 1.0.0
          src="$(node -p "require('./package.json').version")"
          echo "Release tag: $tag"
          echo "Tag base version: $base"
          echo "Source version (package.json): $src"
          if [ "$base" != "$src" ]; then
            echo "::error::Release tag '$tag' (base $base) != package.json version '$src'. Fix the version or the tag."
            exit 1
          fi

  # ── macOS universal bundle ──────────────────────────────────────────────
  # Builds a single universal (Intel + Apple Silicon) .dmg on macos-14, signed
  # and notarized when the APPLE_* secrets are present. Stages it under the
  # stable name Turnstile-macOS-universal.dmg (#24) and uploads it for the
  # attach job.
  macos:
    name: macOS universal (.dmg)
    needs: check
    runs-on: macos-14
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Generates .svelte-kit/ (route types, ambient $app/$env types) that the
      # frontend build invoked by tauri's beforeBuildCommand needs on a fresh
      # checkout, matching the other workflows.
      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      # Both arch slices are required to fuse a universal binary. macos-14 ships
      # rustup with the host (aarch64) target; add x86_64 explicitly.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: universal-apple-darwin

      # Build the universal bundle. Tauri reads the APPLE_* env vars directly:
      # APPLE_CERTIFICATE/APPLE_CERTIFICATE_PASSWORD import the Developer ID cert
      # into a temporary keychain, APPLE_SIGNING_IDENTITY selects it, and
      # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID drive notarization + stapling. When
      # the secrets are unset (forks / before #30), these expand to empty and
      # tauri produces an UNSIGNED bundle without failing — exactly what we want
      # so the matrix stays green without Apple credentials.
      - name: Tauri build (universal, signed + notarized when secrets present)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Updater signing (#52): bundle.createUpdaterArtifacts is on, so tauri
          # signs the .app.tar.gz update bundle with the minisign key (#51) and
          # writes its .sig. Separate from the Apple Developer ID above; the key
          # has no password, so the password var stays empty.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target universal-apple-darwin

      # Copy the built .dmg to its stable, version-less name (#24). The script
      # leaves the versioned original in place and fails loudly on >1 match.
      - name: Stage stable-named artifact
        run: |
          scripts/normalize-artifacts.sh \
            --in src-tauri/target/universal-apple-darwin/release/bundle \
            --out dist

      # Carry the updater bundle (.app.tar.gz) and its minisign signature
      # (.app.tar.gz.sig) alongside the installer so the attach job can build
      # latest.json (#52). Found by their .sig sibling — the only minisign-
      # signed outputs of the build — so we never hardcode tauri's versioned
      # name. Keep the original names: latest.json's URLs are generated to match.
      - name: Stage updater artifacts
        run: |
          set -euo pipefail
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          # Match the updater sig by its full suffix, not a bare *.sig, so a
          # stray signature inside the .app can't be mistaken for one.
          find "$bundle" -type f -name '*.app.tar.gz.sig' |
            while IFS= read -r sig; do
              cp -f "$sig" dist/
              cp -f "${sig%.sig}" dist/
            done

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-macos
          path: dist/
          if-no-files-found: error

  # ── Linux x86_64 bundles ────────────────────────────────────────────────
  # Builds .deb/.rpm/.AppImage on ubuntu-22.04 using the same WebKit/GTK system
  # deps as the rust CI job, stages them under stable names (#24), and uploads
  # them. References no Apple secrets, so it cannot be blocked by their absence.
  linux:
    name: Linux x86_64 (.deb/.rpm/.AppImage)
    needs: check
    runs-on: ubuntu-22.04
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: false
    steps:
      - uses: actions/checkout@v5

      # Tauri v2 build dependencies — same shared composite action (and so the
      # same package list) as the rust job in ci.yml and the bundle job in
      # linux-bundle.yml. Cached so a hit skips the apt update + download.
      - name: Install system dependencies
        uses: ./.github/actions/linux-deps

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: x86_64-unknown-linux-gnu

      # Produce all three Linux formats (bundle.targets is "all" in
      # tauri.conf.json). Passing --target keeps the output path predictable for
      # the normalize step below.
      # createUpdaterArtifacts is on, so the AppImage gets a signed update bundle
      # (.AppImage.tar.gz + .sig) using the minisign key (#51, #52). The key has
      # no password, so the password var stays empty. deb/rpm get no updater
      # bundle — they're owned by the system package manager (#50).
      - name: Tauri build (bundle)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: pnpm tauri build --target x86_64-unknown-linux-gnu

      - name: Stage stable-named artifacts
        run: |
          scripts/normalize-artifacts.sh \
            --in src-tauri/target/x86_64-unknown-linux-gnu/release/bundle \
            --out dist

      # Carry the AppImage updater bundle (.AppImage.tar.gz) and its signature
      # for latest.json (#52), found by the .sig sibling so the versioned name
      # is never hardcoded. Mirrors the macOS leg.
      - name: Stage updater artifacts
        run: |
          set -euo pipefail
          bundle=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          find "$bundle" -type f -name '*.AppImage.tar.gz.sig' |
            while IFS= read -r sig; do
              cp -f "$sig" dist/
              cp -f "${sig%.sig}" dist/
            done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stable-linux
          path: dist/
          if-no-files-found: error

  # ── Attach assets to the published Release ──────────────────────────────
  # Collects the stable-named artifacts from both legs into one directory,
  # writes SHA256SUMS over all four (#24), and uploads them onto the triggering
  # Release. `--clobber` makes re-runs replace the same stable-named assets
  # rather than fail, satisfying the idempotency criterion. No Release is
  # created here — the maintainer already published it in the UI (#54).
  attach:
    name: Attach assets to Release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    # `gh release upload` needs write access to repo contents (#31).
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Needed for scripts/normalize-artifacts.sh (the SHA256SUMS step below).
      - uses: actions/checkout@v5

      # Merge both legs' uploads into a single dist/ directory. Each leg's
      # upload carries its installers plus its signed updater bundle + .sig.
      - name: Download stable artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stable-*
          path: dist
          merge-multiple: true

      # Build the signed updater manifest from the per-platform update bundles
      # now assembled in dist/ (#52). Written before SHA256SUMS so it's covered
      # by the manifest. The version is the single source in package.json (#25);
      # the URLs point at this release's assets by tag.
      - name: Generate latest.json
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/make-latest-json.mjs \
            --dir dist \
            --version "$version" \
            --tag "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --out dist/latest.json

      # SHA256SUMS spans the full set, so it must be computed here — after both
      # legs' artifacts are present — not on either leg alone (#24).
      - name: Write SHA256SUMS
        run: scripts/normalize-artifacts.sh --out dist --checksums

      - name: List release assets
        run: ls -la dist

      # Upload onto the triggering Release. --clobber replaces existing assets
      # so re-running a failed run re-attaches cleanly instead of erroring on a
      # name collision (#54). The updater bundles (.app.tar.gz /
      # .AppImage.tar.gz) and their .sig files carry tauri's versioned names, so
      # they're collected by glob rather than listed — latest.json references
      # them by those exact names (#52).
      - name: Upload assets to the published Release
        run: |
          set -euo pipefail
          assets=(
            dist/Turnstile-macOS-universal.dmg
            dist/Turnstile-linux-x86_64.deb
            dist/Turnstile-linux-x86_64.rpm
            dist/Turnstile-linux-x86_64.AppImage
            dist/latest.json
            dist/SHA256SUMS
          )
          while IFS= read -r f; do
            assets+=("$f")
          done < <(find dist -maxdepth 1 -type f \
            \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
            -o -name '*.AppImage.tar.gz' -o -name '*.AppImage.tar.gz.sig' \))
          gh release upload "${{ github.event.release.tag_name }}" \
            "${assets[@]}" \
            --clobber
